<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{site_url}}{{path}}">

<!-- Social -->
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{site_url}}{{path}}">
<meta property="og:image" content="{{site_url}}{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}{{og_image}}">

<!-- Icons -->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#070A14">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">

<!-- Styles: tokens first, then components -->
<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/css/terrain.css">
<link rel="stylesheet" href="/assets/css/sections.css">
<link rel="stylesheet" href="/assets/css/page.css">

<!-- Google Analytics 4. One tag, one init, every page, via this partial. -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ga4_id}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ga4_id}}');
</script>
